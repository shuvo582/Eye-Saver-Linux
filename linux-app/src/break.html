<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>Break</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at center, #1e293b 0%, #0F172A 70%);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      user-select: none;
    }
    .card {
      text-align: center;
      max-width: 640px;
      padding: 48px;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #06B6D4;
      border: 1px solid #06B6D4;
      border-radius: 999px;
      padding: 6px 14px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 42px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 16px;
      color: #fff;
    }
    p.msg {
      font-size: 20px;
      color: #94a3b8;
      margin-bottom: 36px;
      min-height: 56px;
    }
    .timer {
      font-size: 96px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #FACC15;
      margin-bottom: 32px;
      text-shadow: 0 0 40px rgba(250, 204, 21, 0.35);
    }
    .bar {
      height: 8px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 36px;
    }
    .bar > i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #06B6D4, #1E3A8A);
      width: 100%;
      transition: width 1s linear;
    }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    button {
      font: inherit;
      font-size: 15px;
      padding: 12px 22px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      cursor: pointer;
    }
    button:hover { background: #334155; }
    button.primary {
      background: #1E3A8A;
      border-color: #1E3A8A;
      color: #fff;
    }
    button.primary:hover { background: #1d4ed8; }
    button.ghost { background: transparent; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge" id="badge">Break</div>
    <h1 id="title">Time to rest your eyes</h1>
    <p class="msg" id="msg"></p>
    <div class="timer" id="timer">00:00</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="actions">
      <button id="btnDelay1" class="ghost">Delay 1 min</button>
      <button id="btnDelay5" class="ghost">Delay 5 min</button>
      <button id="btnSkip" class="ghost">Skip</button>
      <button id="btnClose" class="primary">I'm done</button>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const total = parseInt(params.get('total') || '600', 10);
    const reason = params.get('reason') || 'break';
    const message = params.get('message') || 'Rest your eyes. Look at something far away.';

    document.getElementById('msg').textContent = message;
    document.getElementById('badge').textContent = reason === 'micro' ? 'Micro pause' : 'Break';
    document.getElementById('title').textContent =
      reason === 'micro' ? 'Blink & relax' : 'Look away from the screen';

    const skipBtn = document.getElementById('btnSkip');
    const delay1 = document.getElementById('btnDelay1');
    const delay5 = document.getElementById('btnDelay5');
    if (reason === 'micro') {
      skipBtn.style.display = 'none';
      delay1.style.display = 'none';
      delay5.style.display = 'none';
    }

    let remaining = total;
    const timerEl = document.getElementById('timer');
    const barEl = document.getElementById('bar');

    function fmt(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
    }

    function render() {
      timerEl.textContent = fmt(Math.max(0, remaining));
      const pct = total > 0 ? (remaining / total) * 100 : 0;
      barEl.style.width = pct + '%';
    }

    window.eyeSaver.onTick((r) => {
      remaining = r;
      render();
      if (remaining <= 0) {
        window.eyeSaver.breakFinished();
      }
    });

    document.getElementById('btnClose').addEventListener('click', () => {
      window.eyeSaver.breakFinished();
    });
    document.getElementById('btnSkip').addEventListener('click', () => {
      window.eyeSaver.skipBreak();
    });
    document.getElementById('btnDelay1').addEventListener('click', () => {
      window.eyeSaver.delayBreak(1);
    });
    document.getElementById('btnDelay5').addEventListener('click', () => {
      window.eyeSaver.delayBreak(5);
    });

    render();
  </script>
</body>
</html>
