name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (deb + appimage)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file \
            desktop-file-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri-app/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tauri-app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release (strip / opt-level=s / lto)
        working-directory: tauri-app/src-tauri
        run: cargo build --release --locked || cargo build --release

      - name: Measure binary size
        id: bin_size
        run: |
          BIN=tauri-app/src-tauri/target/release/eye-saver
          ls -la "$BIN"
          SIZE=$(stat -c%s "$BIN")
          SIZE_H=$(du -h "$BIN" | cut -f1)
          echo "bytes=$SIZE" >> "$GITHUB_OUTPUT"
          echo "human=$SIZE_H" >> "$GITHUB_OUTPUT"
          {
            echo "## Binary size"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| eye-saver | **${SIZE_H}** (${SIZE} bytes) |"
            echo "| Budget | 10 MB (10485760 bytes) |"
            if [ "$SIZE" -le 10485760 ]; then
              echo "| Status | ✅ within 10 MB |"
            else
              echo "| Status | ❌ over 10 MB |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bundle deb + AppImage
        working-directory: tauri-app/src-tauri
        run: |
          # Prefer tauri CLI via cargo if available; else install tauri-cli
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            cargo install tauri-cli --locked --version '^2' || cargo install tauri-cli --locked
          fi
          cargo tauri bundle --bundles deb,appimage

      - name: Measure packages
        id: pkg_size
        run: |
          mkdir -p dist
          find tauri-app/src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' \) -exec cp {} dist/ \;
          ls -la dist/ || true
          {
            echo ""
            echo "## Package sizes"
            echo ""
            echo "| Artifact | Size |"
            echo "|----------|------|"
            for f in dist/*; do
              [ -f "$f" ] || continue
              b=$(stat -c%s "$f")
              h=$(du -h "$f" | cut -f1)
              echo "| $(basename "$f") | ${h} (${b} bytes) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eye-saver-linux
          path: |
            dist/*
            tauri-app/src-tauri/target/release/eye-saver
          if-no-files-found: warn
          retention-days: 30

      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            tauri-app/src-tauri/target/release/eye-saver
