name: Build Linux App

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: linux-app/package-lock.json

      - name: Install dependencies
        working-directory: linux-app
        run: npm ci || npm install

      - name: Build Electron Linux packages
        working-directory: linux-app
        run: npm run dist:all
        env:
          # electron-builder needs no code-signing for Linux artifacts
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List artifacts
        working-directory: linux-app
        run: ls -lah dist/ || true

      - name: Upload Linux binary (AppImage + deb)
        uses: actions/upload-artifact@v4
        with:
          name: eye-saver-linux
          path: |
            linux-app/dist/*.AppImage
            linux-app/dist/*.deb
            linux-app/dist/*.yml
          if-no-files-found: error
          retention-days: 30

  # Optional: attach assets to a GitHub Release when a tag is pushed
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: eye-saver-linux
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
          generate_release_notes: true
