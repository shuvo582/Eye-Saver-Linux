[package]
name = "eye-saver"
version = "2.48.0"
description = "Eye Saver — break reminders, micro pauses, blue filter for Linux"
authors = ["Mehedi Hasan Shuvo"]
edition = "2021"
license = "MIT"
repository = "https://github.com/shuvo582/Eye-Saver-Linux"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
incremental = false
debug = false

[lib]
name = "eye_saver"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "eye-saver"
path = "src/main.rs"
